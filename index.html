<!-- فونت‌های استاندارد وزیرمتن و اینتر -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                fontFamily: {
                    sans: ['Vazirmatn', 'Inter', 'sans-serif'],
                    en: ['Inter', 'sans-serif']
                },
                colors: {
                    glass: {
                        blue: '#0A84FF',
                        indigo: '#5E5CE6',
                        purple: '#BF5AF2',
                        pink: '#FF375F',
                        cyan: '#64D2FF',
                        teal: '#40C8E0',
                        emerald: '#30D158',
                        amber: '#FFD60A',
                        darkBase: '#07070d'
                    }
                }
            }
        }
    }
</script>

<style>
    /* =====================================================================
       استایل‌های اختصاصی Liquid Glassmorphism و Safe Area Insets
       ===================================================================== */
    :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
    }

    body {
        font-family: 'Vazirmatn', sans-serif;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        padding-bottom: max(36px, var(--sab));
    }

    /* حاشیه امن سربرگ برای عدم تداخل با ساعت و آنتن */
    .safe-top-header {
        padding-top: max(16px, var(--sat));
    }

    /* بافت شیشه‌ای مات و مایع چندلایه Liquid Glass */
    .liquid-glass {
        backdrop-filter: blur(34px) saturate(200%);
        -webkit-backdrop-filter: blur(34px) saturate(200%);
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .dark .liquid-glass {
        background: linear-gradient(135deg, rgba(26, 26, 40, 0.72) 0%, rgba(12, 12, 20, 0.82) 100%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 20px 48px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    html:not(.dark) .liquid-glass {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.88) 0%, rgba(240, 244, 255, 0.76) 100%);
        border: 1px solid rgba(255, 255, 255, 0.95);
        box-shadow: 0 16px 36px rgba(0, 80, 220, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    /* هدر معلق شیشه‌ای که متون به نرمی از زیر آن عبور می‌کنند */
    .liquid-header {
        backdrop-filter: blur(38px) saturate(210%);
        -webkit-backdrop-filter: blur(38px) saturate(210%);
    }
    .dark .liquid-header {
        background: rgba(7, 7, 13, 0.84);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    html:not(.dark) .liquid-header {
        background: rgba(244, 247, 254, 0.88);
        border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    }

    /* دکمه‌های کپسولی شیشه‌ای با فیدبک لمسی طبیعی */
    .glass-pill {
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        transition: transform 0.15s ease, background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .glass-pill:active {
        transform: scale(0.96);
    }

    /* انیمیشن امواج صوتی Siri در حالت شنیداری */
    @keyframes voiceAura {
        0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 55, 95, 0.65); }
        70% { transform: scale(1.08); box-shadow: 0 0 0 20px rgba(255, 55, 95, 0); }
        100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 55, 95, 0); }
    }
    .voice-recording-glow {
        animation: voiceAura 1.5s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* هاله‌های نوری پس‌زمینه (Ambient Glow Mesh) */
    .ambient-mesh {
        position: fixed;
        pointer-events: none;
        z-index: 0;
        filter: blur(95px);
        opacity: 0.55;
        transition: opacity 0.5s ease;
    }

    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; }
</style>
