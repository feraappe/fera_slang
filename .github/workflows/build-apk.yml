name: Build Android APK

on:
push:
branches:
- main
- master
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout Code
uses: actions/checkout@v4

  - name: Setup Java JDK 21
    uses: actions/setup-java@v5
    with:
      distribution: 'temurin'
      java-version: '21'

  - name: Setup Node.js 22
    uses: actions/setup-node@v4
    with:
      node-version: '22'

  - name: Prepare Web Directory
    run: |
      mkdir -p www
      if [ -f "index.html" ]; then
        cp index.html www/index.html
        echo "Direct index.html placed in www/"
      else
        FOUND=$(find . -name "index.html" -not -path "*/.*" -not -path "*/node_modules/*" | head -n 1)
        if [ -n "$FOUND" ]; then
          cp "$FOUND" www/index.html
          echo "Discovered index.html at $FOUND and copied to www/"
        else
          echo "CRITICAL: No index.html found!"
          exit 1
        fi
      fi

  - name: Initialize Capacitor with Safe Config
    run: |
      npm init -y
      npm install @capacitor/core @capacitor/cli @capacitor/android
      node -e '
        const fs = require("fs");
        const config = {
          appId: "com.feraslang.app",
          appName: "FeRa Slang",
          webDir: "www",
          backgroundColor: "#07070d",
          server: {
            cleartext: true
          }
        };
        fs.writeFileSync("capacitor.config.json", JSON.stringify(config, null, 2));
      '
      npx cap add android
      npx cap sync android
      npx cap copy android

  - name: Force Native Assets Placement
    run: |
      mkdir -p android/app/src/main/assets/public
      cp -r www/* android/app/src/main/assets/public/
      ls -la android/app/src/main/assets/public/index.html

  - name: Fast Gradle Config
    run: |
      PROP="android/gradle/wrapper/gradle-wrapper.properties"
      if [ -f "$PROP" ]; then
        sed -i 's/-all.zip/-bin.zip/g' "$PROP"
      fi

  - name: Setup Gradle Action
    uses: gradle/actions/setup-gradle@v4

  - name: Configure Java 21 and SDK
    run: |
      echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
      echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties

  - name: Generate Launcher Icons
    run: |
      pip install Pillow
      python3 -c '
      import os
      from PIL import Image
      src = "icon.png" if os.path.exists("icon.png") else ("logo.png" if os.path.exists("logo.png") else None)
      if src:
          img = Image.open(src).convert("RGBA")
          densities = [
              ("mipmap-mdpi", 48),
              ("mipmap-hdpi", 72),
              ("mipmap-xhdpi", 96),
              ("mipmap-xxhdpi", 144),
              ("mipmap-xxxhdpi", 192)
          ]
          for folder, size in densities:
              target = os.path.join("android/app/src/main/res", folder)
              os.makedirs(target, exist_ok=True)
              resized = img.resize((size, size), Image.Resampling.LANCZOS)
              resized.save(os.path.join(target, "ic_launcher.png"))
              resized.save(os.path.join(target, "ic_launcher_round.png"))
              resized.save(os.path.join(target, "ic_launcher_foreground.png"))
          print("Icons generated successfully!")
      else:
          print("No icon.png found, retaining default icons.")
      '

  - name: Update AndroidManifest Permissions
    run: |
      node -e '
        const fs = require("fs");
        const path = "android/app/src/main/AndroidManifest.xml";
        if (fs.existsSync(path)) {
          let xml = fs.readFileSync(path, "utf8");
          const perms = [
            "android.permission.INTERNET",
            "android.permission.ACCESS_NETWORK_STATE",
            "android.permission.RECORD_AUDIO",
            "android.permission.MODIFY_AUDIO_SETTINGS"
          ];
          let toAdd = "";
          perms.forEach(p => {
            if (!xml.includes(p)) {
              toAdd += `\n    <uses-permission android:name="${p}" />`;
            }
          });
          if (toAdd) {
            xml = xml.replace("<application", toAdd + "\n    <application");
          }
          if (!xml.includes("android:usesCleartextTraffic")) {
            xml = xml.replace("<application", `<application android:usesCleartextTraffic="true"`);
          }
          if (!xml.includes("android:hardwareAccelerated")) {
            xml = xml.replace("<application", `<application android:hardwareAccelerated="true"`);
          }
          fs.writeFileSync(path, xml, "utf8");
          console.log("Manifest successfully updated.");
        }
      '

  - name: Generate Release Keystore
    run: |
      keytool -genkeypair -v -keystore android/release.keystore -alias feraslang -keyalg RSA -keysize 2048 -validity 10000 -storepass feraslang2026 -keypass feraslang2026 -dname "CN=FeRaSlang, OU=App, O=FeRa, L=Tehran, ST=Tehran, C=IR"

  - name: Build Packages
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    run: |
      cd android
      chmod +x gradlew
      ./gradlew assembleDebug assembleRelease --no-daemon

  - name: Align and Sign Bazaar APK
    run: |
      mkdir -p output-apks
      if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
        cp android/app/build/outputs/apk/debug/app-debug.apk output-apks/FeRa-Slang-Debug-Test.apk
      fi
      BUILD_TOOLS=$(ls -d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -n 1)
      UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
      if [ -f "$UNSIGNED_APK" ]; then
        $BUILD_TOOLS/zipalign -v -p 4 "$UNSIGNED_APK" android/app/build/outputs/apk/release/app-release-aligned.apk
        $BUILD_TOOLS/apksigner sign --ks android/release.keystore --ks-pass pass:feraslang2026 --ks-key-alias feraslang --key-pass pass:feraslang2026 --out output-apks/FeRa-Slang-Release-Bazaar.apk android/app/build/outputs/apk/release/app-release-aligned.apk
        echo "Release APK signed successfully!"
      elif [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
        cp android/app/build/outputs/apk/release/app-release.apk output-apks/FeRa-Slang-Release-Bazaar.apk
      fi
      if [ -f "android/release.keystore" ]; then
        cp android/release.keystore output-apks/feraslang-release.keystore
      fi

  - name: Upload Deliverables
    uses: actions/upload-artifact@v4
    with:
      name: FeRa-Slang-Official-Package
      path: output-apks/
