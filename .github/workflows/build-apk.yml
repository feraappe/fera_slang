name: Build Android APK (FeRa Slang)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify and Prepare Web Assets
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/index.html
            echo "Successfully found and copied index.html"
          else
            FOUND=$(find . -name "index.html" -not -path "*/.*" | head -n 1)
            if [ -n "$FOUND" ]; then
              cp "$FOUND" www/index.html
              echo "Found index.html at $FOUND and copied to www/"
            else
              echo "ERROR: index.html not found in repository! Please upload index.html."
              exit 1
            fi
          fi

      - name: Setup Capacitor and Android Project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.feraslang.app",
            "appName": "FeRa Slang",
            "webDir": "www"
          }
          EOF
          npx cap add android
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties

      - name: Configure Android Permissions
        run: |
          node -e '
            const fs = require("fs");
            const file = "android/app/src/main/AndroidManifest.xml";
            if (fs.existsSync(file)) {
              let xml = fs.readFileSync(file, "utf8");
              const perms = "\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n    <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\" />\n";
              if (!xml.includes("RECORD_AUDIO")) {
                xml = xml.replace("<application", perms + "    <application");
                fs.writeFileSync(file, xml, "utf8");
                console.log("Audio permissions injected successfully.");
              }
            }
          '

      - name: Build Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FeRa-Slang-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
