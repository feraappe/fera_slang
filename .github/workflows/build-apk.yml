name: Build Android APK (FeRa Slang)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Capacitor & Config
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p www
          cp index.html www/index.html
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.feraslang.app",
            "appName": "FeRa Slang",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF
          npx cap add android
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties

      - name: Inject Android Permissions
        run: |
          node -e "
            const fs = require('fs');
            const file = 'android/app/src/main/AndroidManifest.xml';
            let xml = fs.readFileSync(file, 'utf8');
            const perms = [
              '    <uses-permission android:name=\"android.permission.INTERNET\" />',
              '    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />',
              '    <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\" />'
            ].join('\n');
            if (!xml.includes('android.permission.RECORD_AUDIO')) {
              xml = xml.replace(/<application/i, perms + '\n    <application');
              fs.writeFileSync(file, xml, 'utf8');
              console.log('Permissions injected successfully!');
            }
          "

      - name: Build Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FeRa-Slang-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
