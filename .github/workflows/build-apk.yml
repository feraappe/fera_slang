```
  - name: Setup Node.js (Active LTS)
    uses: actions/setup-node@v4
    with:
      node-version: 22

  - name: Setup Java JDK
    uses: actions/setup-java@v5
    with:
      distribution: 'zulu'
      java-version: '17'

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Initialize Capacitor Project
    run: |
      npm init -y
      npm install @capacitor/core @capacitor/cli @capacitor/android
      mkdir -p www
      cp index.html www/index.html
      npx cap init "FeRa Slang" "com.feraslang.app" --web-dir "www"
      npx cap add android

  - name: Inject Android Permissions
    run: |
      sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET" />\n<uses-permission android:name="android.permission.RECORD_AUDIO" />\n<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' android/app/src/main/AndroidManifest.xml

  - name: Build Debug APK
    run: |
      cd android
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Upload APK to Artifacts
    uses: actions/upload-artifact@v4
    with:
      name: fera-slang-apk
      path: android/app/build/outputs/apk/debug/app-debug.apk

```
